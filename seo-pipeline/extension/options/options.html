<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>SEO Pipeline Bridge</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; min-width: 360px; color: #1f2328; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    input[type=text], input[type=password], input[type=number] { width: 100%; padding: 6px; box-sizing: border-box; }
    .row { display: flex; gap: 16px; margin-top: 8px; }
    button { margin-top: 12px; padding: 6px 12px; }
    #status { margin-left: 8px; color: #1a7f37; }
    pre { background: #f6f8fa; padding: 8px; max-height: 240px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h3>SEO Pipeline Bridge</h3>
  <label for="apiBase">API pipeline</label>
  <input id="apiBase" type="text" placeholder="http://localhost:8000" />
  <label for="token">Extension token (SEO_EXTENSION_TOKEN)</label>
  <input id="token" type="password" />
  <label for="pollSeconds">Chu kỳ hỏi task (giây, tối thiểu 30)</label>
  <input id="pollSeconds" type="number" min="30" />
  <div class="row">
    <label><input id="openai" type="checkbox" /> ChatGPT</label>
    <label><input id="gemini" type="checkbox" /> Gemini</label>
  </div>
  <label><input id="debug" type="checkbox" /> Debug: mở tab ở phía trước; giữ lại tab của task lỗi (mỗi hãng tối đa 1 tab)</label>
  <button id="save">Lưu</button>
  <button id="poll">Hỏi task ngay</button><span id="status"></span>
  <p>Client ID: <code id="clientId"></code></p>
  <h4>Nhật ký gần đây</h4>
  <pre id="logs"></pre>
  <script src="options.js"></script>
</body>
</html>
